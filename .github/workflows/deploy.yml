name: Deploy to AWS

on:
  push:
    branches:
      - main   # or your deploy branch

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # match your AWS environment

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Deploy to AWS server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.AWS_USER }}/DrishtiAI
            git pull origin main
            npm install --production
            pm2 start npm --name "DrishtiAI" -- start || pm2 restart DrishtiAI
            pm2 save
